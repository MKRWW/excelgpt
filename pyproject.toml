[project]
name = "excelgpt"
version = "0.1.0"
description = "Character-level Pre-LayerNorm Transformer with full intermediate tracing for library-free reimplementation"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=2.0",
    "xlwings>=0.33",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
